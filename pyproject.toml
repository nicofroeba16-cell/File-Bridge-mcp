[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "file-bridge-mcp"
version = "0.9.4"
description = "Testable MCP server for the Home Assistant File Bridge"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "jsonschema>=4.23,<5",
]

[project.scripts]
file-bridge-mcp = "server.stdio:main"
file-bridge-http = "server.main:app"

[tool.setuptools]
packages = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
